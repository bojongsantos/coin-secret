name: Setup capture

# Hostinger's native Node cron is primary. GitHub is a best-effort fallback;
# these schedules can be delayed and do not guarantee a 30-minute cadence.
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-capture
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Trigger the setup capture sweep
        env:
          APP_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node scripts/setup-capture-cron.mjs
