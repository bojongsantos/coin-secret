name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Placeholders only. Nothing in this workflow opens a database connection or
# issues a session: `prisma generate` reads the schema, the tests are pure
# units, and `next build` compiles. They exist because prisma.config.ts
# resolves DATABASE_URL eagerly and fails the install step without it.
env:
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-any-real-session
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the Node version README asks contributors to run.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
