# Pinned so the project name comes from this file rather than from whatever
# the checkout directory happens to be called. Without it, container, network
# and volume names follow the folder, and a renamed project silently keeps
# creating resources under its old name.
name: coinsecret

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coinsecret
      POSTGRES_PASSWORD: coinsecret_dev
      POSTGRES_DB: coinsecret
    # 5433 rather than a high port: Windows reserves large dynamic ranges for
    # Hyper-V, and a port that falls inside one fails to bind with a permissions
    # error that says nothing about the real cause. Check with
    # `netsh interface ipv4 show excludedportrange protocol=tcp` before moving it.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinsecret -d coinsecret"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - coinsecret_postgres:/var/lib/postgresql/data

volumes:
  coinsecret_postgres:
